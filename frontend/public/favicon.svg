<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>

  <!-- V wings -->
  <path d="M32 10 L8 40 L16 40 L32 18 L48 40 L56 40 Z"
        fill="url(#ga)" filter="url(#glow)"/>
  <!-- Wing cutout left -->
  <path d="M32 16 L12 39 L16 39 L32 21 Z" fill="#0a0a0a" opacity="0.55"/>
  <!-- Wing cutout right -->
  <path d="M32 16 L52 39 L48 39 L32 21 Z" fill="#0a0a0a" opacity="0.55"/>

  <!-- Center diamond -->
  <polygon points="32,20 39,32 32,44 25,32" fill="url(#ga)" filter="url(#glow)"/>
  <polygon points="32,26 36,32 32,38 28,32" fill="#0a0a0a"/>

  <!-- Top dot -->
  <circle cx="32" cy="10" r="2.5" fill="#f97316" filter="url(#glow)"/>

  <!-- Side accent lines -->
  <line x1="4" y1="32" x2="10" y2="32" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
  <line x1="54" y1="32" x2="60" y2="32" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
</svg>
